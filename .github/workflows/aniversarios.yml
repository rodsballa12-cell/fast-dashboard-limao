name: Aniversários — fila diária

on:
  workflow_dispatch:
  schedule:
    # 08h BRT (= 11h UTC) — antes de abrir a loja
    - cron: '0 11 * * *'

permissions:
  contents: write
  issues: write

jobs:
  fila:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gerar fila do dia
        id: fila
        run: python scripts/aniversario_fila.py

      - name: Commit fila
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/aniversarios_fila.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sem mudanças na fila"
          else
            git commit -m "aniv: atualiza fila $(date -u +'%Y-%m-%d')"
            git push
          fi

      - name: Cria issue de aprovação (se houver aniversariante)
        if: steps.fila.outputs.n_aniv != '' && steps.fila.outputs.n_aniv != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Garante que a label existe (idempotente)
          gh label create aniversario --color FFB6C1 --description "Fila de aprovação de aniversários" 2>/dev/null || true
          BODY=$(cat data/.issue_body.md)
          DATA=$(date -u -d '-3 hours' +'%d/%m/%Y')
          N="${{ steps.fila.outputs.n_aniv }}"
          gh issue create \
            --title "🎂 Aniversariantes $DATA · $N cliente(s) · aguardando aprovação" \
            --body "$BODY" \
            --label aniversario
