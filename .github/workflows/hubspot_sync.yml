name: HubSpot — sync contatos (Trinks → CRM)

# DESATIVADO em 14/09/2026 por decisão do Rodrigo.
#
# O que ele fazia: enviar clientes do Trinks pra HubSpot, upsert por email com
# fallback pra trinks_id. Rodava todo dia às 02h15 BRT.
#
# Por que foi desligado: `hubspot.contatos` marcava ZERO — a base nunca foi
# importada. A rotina rodava diariamente sem trazer nada pro painel, e o que
# o HubSpot ofereceria (funil de vendas, sequência de e-mail, automação de
# negócio) não tem onde encostar num salão sem hora marcada, em que a venda
# acontece na porta. O Trinks já entrega os 411 clientes com histórico, LTV,
# churn e aniversário, e o painel já abre a conversa pelo botão 📱.
#
# Manter dois cadastros de cliente seria duplicar a fonte da verdade — o mesmo
# defeito que a auditoria de coerência existe pra pegar.
#
# Mantido com workflow_dispatch: se um dia houver necessidade real de CRM,
# reativar é recolocar o cron abaixo. Ver docs/decisoes/.

on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: '15 5 * * *'   # 02h15 BRT — desativado em 14/09/2026

permissions:
  contents: read

concurrency:
  group: hubspot-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          HUBSPOT_PORTAL_ID: '51943728'
        run: python scripts/hubspot_sync.py
