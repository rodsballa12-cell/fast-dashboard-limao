name: Cargos na nuvem (parecer diário e conselho)

# Por que existe (31/10/2026): os sete cargos só rodavam no PC do Rodrigo, e
# de 23 a 31/10 nenhum parecer de verdade saiu. Primeiro o crédito acabou,
# depois o claude do PC passou a responder "o comando /conselho não existe",
# depois o PC parou de mandar ata. Aqui eles rodam com o PC ligado ou não,
# com a chave do cofre que já está nos Secrets.
#
# Custo: usa CLAUDE_CODE_OAUTH_TOKEN, gerado no PC com `claude setup-token`.
# É a mesma assinatura Max do PC, sem cobrança por uso da API.
#
# O PC continua com o que só ele alcança (Excel, DRE, SULTS, Obsidian). Quando
# a ata da nuvem já existe, o rodar_agente.ps1 só copia a ata para o vault.

on:
  # Religado em 19/11/2026, como RESERVA da rodada da madrugada do PC.
  # Motivo do desligamento de 13/11: o token dava 401 e cada falha gravava uma ata
  # de erro por cima do parecer bom do PC. O token foi trocado e testado em 19/11.
  #
  # Regra de cota (Rodrigo, 19/11): NADA disto roda em horário comercial. O PC faz
  # a fila às 00h40 (termina por volta das 03h). A nuvem entra DEPOIS, das 04h às
  # 06h30 (BRT), uma de cada vez, e cada cargo só trabalha se o parecer do dia de
  # referência ainda não existir: se o PC já fez, a rodada termina em segundos e
  # não gasta cota. Uma execução que o GitHub atrase para depois das 08h é pulada.
  #
  # Espaço de 20 min entre os cargos: o `concurrency` guarda só UMA execução
  # esperando, então dois cargos colados perderiam um deles.
  #
  # 20/11/2026: na primeira madrugada NENHUMA das sete disparou (o GitHub descarta
  # cron em horário redondo sob carga). Por isso: (1) minutos quebrados (:07, :27,
  # :47) e (2) uma SEGUNDA TENTATIVA dos sete cargos, das 06h37 às 07h37, mais
  # apertada (10 min) porque quase tudo já terá parecer e termina em segundos.
  # Depois das 08h (atraso do GitHub) nada roda.
  schedule:
    # UTC; Brasília = UTC-3
    # 1ª tentativa
    - cron: '7 7 * * *'    # 04h07 Memória
    - cron: '27 7 * * *'   # 04h27 Marketing
    - cron: '47 7 * * *'   # 04h47 Financeiro
    - cron: '7 8 * * *'    # 05h07 Relacionamento
    - cron: '27 8 * * *'   # 05h27 Pessoas
    - cron: '47 8 * * *'   # 05h47 Operação
    - cron: '7 9 * * *'    # 06h07 Conselho (até ~06h32)
    # 2ª tentativa (só trabalha o que ainda não tem parecer)
    - cron: '37 9 * * *'   # 06h37 Memória
    - cron: '47 9 * * *'   # 06h47 Marketing
    - cron: '57 9 * * *'   # 06h57 Financeiro
    - cron: '7 10 * * *'   # 07h07 Relacionamento
    - cron: '17 10 * * *'  # 07h17 Pessoas
    - cron: '27 10 * * *'  # 07h27 Operação
    - cron: '37 10 * * *'  # 07h37 Conselho
  workflow_dispatch:
    inputs:
      agente:
        description: 'Cargo (memoria, marketing, financeiro, relacionamento, pessoas, operacao-diaria, conselho)'
        required: true
        default: 'conselho'

permissions:
  contents: write
  issues: write

concurrency:
  group: cargos-nuvem
  cancel-in-progress: false

jobs:
  cargo:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Qual cargo
        id: qual
        run: |
          case "${{ github.event.schedule }}" in
            '7 7 * * *'|'37 9 * * *')    a=memoria ;;
            '27 7 * * *'|'47 9 * * *')   a=marketing ;;
            '47 7 * * *'|'57 9 * * *')   a=financeiro ;;
            '7 8 * * *'|'7 10 * * *')    a=relacionamento ;;
            '27 8 * * *'|'17 10 * * *')  a=pessoas ;;
            '47 8 * * *'|'27 10 * * *')  a=operacao-diaria ;;
            '7 9 * * *'|'37 10 * * *')   a=conselho ;;
            *)             a="${{ github.event.inputs.agente }}" ;;
          esac
          # Dia de referência: na rodada agendada da madrugada é ONTEM (dia já
          # fechado), como no PC. Disparo manual vale hoje, como sempre valeu.
          hora=$(TZ=America/Sao_Paulo date +%H)
          dia=$(TZ=America/Sao_Paulo date +%F)
          pula=nao
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ $((10#$hora)) -ge 8 ]; then pula=sim; fi
            if [ $((10#$hora)) -lt 12 ]; then dia=$(TZ=America/Sao_Paulo date -d yesterday +%F); fi
          fi
          echo "agente=$a" >> "$GITHUB_OUTPUT"
          echo "dia=$dia" >> "$GITHUB_OUTPUT"
          echo "pula=$pula" >> "$GITHUB_OUTPUT"
          echo "Cargo: $a · dia de referência: $dia · pular (fora da madrugada): $pula"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Já tem parecer de hoje?
        id: ja
        env:
          TZ: America/Sao_Paulo
        run: |
          if [ "${{ steps.qual.outputs.pula }}" = "sim" ]; then
            # execução agendada que o GitHub atrasou para depois das 08h: não gasta cota
            echo "tem=sim" >> "$GITHUB_OUTPUT"
            echo "Fora da janela da madrugada (depois das 08h): pulado."
            exit 0
          fi
          r=$(python3 scripts/agenda/gravar_ata.py --ja-tem "${{ steps.qual.outputs.agente }}" "${{ steps.qual.outputs.dia }}")
          echo "tem=$r" >> "$GITHUB_OUTPUT"
          echo "Já existe parecer válido hoje: $r"

      - name: Abrir cofre
        if: steps.ja.outputs.tem != 'sim'
        env:
          FAST_COFRE_CHAVE: ${{ secrets.FAST_COFRE_CHAVE }}
          FAST_PAINEL_SENHA: ${{ secrets.FAST_PAINEL_SENHA }}
        run: python3 -m pip install -q cryptography && python3 scripts/cofre.py abrir

      - name: Instalar Claude Code
        if: steps.ja.outputs.tem != 'sim'
        run: npm install -g @anthropic-ai/claude-code

      - name: Confiar na pasta do projeto
        if: steps.ja.outputs.tem != 'sim'
        # Sem isto o claude ignora as permissões de .claude/settings.json
        # ("this workspace has not been trusted"), como no 1º teste de 01/11/2026.
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          arq = pathlib.Path.home() / ".claude.json"
          d = json.loads(arq.read_text()) if arq.exists() else {}
          d.setdefault("projects", {}).setdefault(os.environ["GITHUB_WORKSPACE"], {})["hasTrustDialogAccepted"] = True
          arq.write_text(json.dumps(d))
          print("pasta confiável:", os.environ["GITHUB_WORKSPACE"])
          PY

      - name: Rodar o cargo
        if: steps.ja.outputs.tem != 'sim'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TZ: America/Sao_Paulo
        run: |
          AG="${{ steps.qual.outputs.agente }}"
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "Falta o segredo CLAUDE_CODE_OAUTH_TOKEN no GitHub (gere no PC com 'claude setup-token')." > /tmp/saida.txt
            exit 0
          fi
          PEDIDO=$(python3 scripts/agenda/gravar_ata.py --pedido "$AG" "${{ steps.qual.outputs.dia }}")
          # 25 min para o conselho (ele lê os seis cargos), 14 para os demais.
          LIM=840; [ "$AG" = "conselho" ] && LIM=1500
          timeout "$LIM" claude -p "$PEDIDO" --output-format text > /tmp/saida.txt 2>&1 \
            || echo "[claude terminou com código $? — tempo limite ${LIM}s]" >> /tmp/saida.txt
          wc -c /tmp/saida.txt

      - name: Gravar ata e conferir o formato
        id: ata
        if: steps.ja.outputs.tem != 'sim'
        env:
          TZ: America/Sao_Paulo
        run: python3 scripts/agenda/gravar_ata.py "${{ steps.qual.outputs.agente }}" /tmp/saida.txt --origem "nuvem (GitHub Actions)" --dia "${{ steps.qual.outputs.dia }}"

      - name: Carimbo de saúde
        if: steps.ja.outputs.tem != 'sim'
        env:
          TZ: America/Sao_Paulo
        run: |
          AG="${{ steps.qual.outputs.agente }}"
          CH=cargos; [ "$AG" = "conselho" ] && CH=conselho
          python3 scripts/saude.py carimbar "$CH" "${{ steps.ata.outputs.resultado }}" "$AG nuvem · ${{ steps.ata.outputs.motivo }}"

      - name: Publicar a ata
        if: steps.ja.outputs.tem != 'sim'
        run: |
          git config user.name "FAST Agenda (nuvem)"
          git config user.email "noreply@anthropic.com"
          # Só a ata e o carimbo. O que o cofre abriu está no .gitignore e não entra.
          git add -- "${{ steps.ata.outputs.arquivo }}" data/saude.json
          git diff --cached --quiet && { echo "nada novo"; exit 0; }
          git commit -m "ata: ${{ steps.qual.outputs.agente }} (nuvem) · ${{ steps.ata.outputs.resultado }}"
          for t in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash origin main || true
            sleep $((t * 5))
          done
          echo "::error::Nao consegui empurrar a ata."
          exit 1

      - name: Avisar quando falhar
        if: steps.ja.outputs.tem != 'sim' && steps.ata.outputs.resultado == 'falha'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AG="${{ steps.qual.outputs.agente }}"
          TIT="Cargo sem parecer: $AG"
          {
            echo "O cargo **$AG** rodou na nuvem e **não entregou parecer** no formato do protocolo."
            echo
            echo "Motivo: ${{ steps.ata.outputs.motivo }}"
            echo
            echo "Ata: \`${{ steps.ata.outputs.arquivo }}\` · execução: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "---"
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
          } > /tmp/corpo.md
          n=$(gh issue list --state open --search "in:title \"$TIT\"" --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body-file /tmp/corpo.md
          else gh issue create --title "$TIT" --body-file /tmp/corpo.md; fi

      - name: Conselho chega no celular
        if: steps.qual.outputs.agente == 'conselho' && steps.ata.outputs.resultado == 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Um issue por noite: o GitHub manda e-mail e notificação no app.
          # O de ontem fecha sozinho, para a lista não virar paisagem.
          for n in $(gh issue list --state open --label conselho --json number -q '.[].number'); do
            gh issue close "$n" --comment "Substituído pelo conselho de hoje."
          done
          gh label create conselho --color FBD300 --description "Ata do conselho da noite" 2>/dev/null || true
          { sed '1,/^---$/d' "${{ steps.ata.outputs.arquivo }}"; echo; echo "---"; echo "_Generated by [Claude Code](https://claude.ai/code)_"; } > /tmp/conselho.md
          gh issue create --title "⚖️ Conselho $(date -d "${{ steps.qual.outputs.dia }}" +%d/%m)" --label conselho --body-file /tmp/conselho.md
