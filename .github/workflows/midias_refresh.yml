name: Refresh Midias Sociais (diario)

# Atualiza data/midias_sociais.json (Escova) e data/spa/midias_sociais.json
# (SPA) pulando a Meta Graph API v20.0 com o token META_ACCESS_TOKEN.
#
# HORARIO: 10h, 12h e 14h UTC = 07h, 09h e 11h BRT (UTC-3 fixo, sem DST).
# 07h BRT e o alvo: a Meta ja consolidou D-1 e o commit fica antes do
# horario comercial abrir.
#
# POR QUE TRES FIRES PARA UM REFRESH SO (16/09/2026)
# O cron do GitHub Actions nao e relogio: ele atrasa horas e as vezes pula.
# Medido neste repositorio, com o fire agendado para 10h UTC:
#   14/09 -> rodou 16h06 UTC (6h06 de atraso)
#   15/09 -> rodou 14h35 UTC (4h35 de atraso)
#   16/09 -> nao rodou ate 11h56 UTC
# Com UM fire por dia, um atraso desses significa painel de midia parado o
# dia inteiro — foi o que o Rodrigo viu em 16/09, com dado de 21h atras.
# Tres fires dao tres chances; o early-exit abaixo faz os dois ultimos
# terminarem em segundos sem tocar na API da Meta.
#
# Mesmo remedio que o refresh.yml ja usava. A licao esta em
# docs/aprendizados/cron-do-github-nao-e-relogio.md.
#
# CAMPOS CURADOS PRESERVADOS: direcionamentos_estrategicos, recomendacoes,
# insights_narrativa, alertas_topo, kpi_estrela, benchmarks,
# google_business, google_ads, hubspot, whatsapp_cloud_api,
# funil_conversao. Esses continuam sendo escritos manualmente via
# Supermetrics MCP quando o gerente Marketing atualizar.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10,12,14 * * *'

permissions:
  contents: write

concurrency:
  group: refresh-midias
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests

      # Ja rodou hoje COM SUCESSO? Entao este e um dos fires extras.
      # A comparacao e por DATA em BRT, nao por horas de idade: o trabalho e
      # "uma atualizacao por dia", e uma regra de horas erraria na virada.
      #
      # E NAO BASTA TER RODADO. Em 18/09/2026 o fire das 11h22 rodou com o
      # token expirado: gravou zeros, carimbou a data de hoje, e a partir dali
      # o early-exit teria bloqueado todos os fires seguintes. O Rodrigo trocou
      # o token as 16h e o painel ficaria quebrado ate o dia seguinte, sem que
      # nada acusasse — o arquivo estava "atualizado hoje".
      #
      # Coleta que falhou deixa `_erro` nas janelas do meta_ads. Enquanto ele
      # estiver la, todo fire tenta de novo.
      # E TAMBEM NAO BASTA A ESCOVA ESTAR EM DIA. Em 19/09/2026 uma sessao do
      # Claude no PC do Rodrigo atualizou so data/midias_sociais.json as 09h15
      # e commitou. Aquele arquivo passou a carimbar a data de hoje — e o
      # early-exit, que olhava so para ele, teria pulado todos os fires
      # seguintes, deixando o Spa e o Consolidado parados em 18/09 o dia
      # inteiro. Atualizacao parcial nao e atualizacao: o skip so vale quando
      # as TRES unidades estao do mesmo dia.
      # Aplica so a fires do cron. Dispatch manual sempre roda — mesma regra
      # do refresh.yml. Sem isso, um conserto no codigo nao tem como ser
      # testado no mesmo dia: o arquivo ja esta com a data de hoje e o skip
      # pula o run inteiro em 11 segundos.
      - name: Ja atualizou hoje (com sucesso, nas tres unidades)?
        id: recencia
        if: github.event_name == 'schedule'
        run: |
          hoje=$(TZ=America/Sao_Paulo date +%Y-%m-%d)
          arquivos="data/midias_sociais.json data/spa/midias_sociais.json data/consolidado/midias_sociais.json"

          atrasados=""
          for f in $arquivos; do
            if [ ! -f "$f" ]; then
              atrasados="${atrasados} ${f}(ausente)"
              continue
            fi
            ger=$(sed -nE 's/.*"gerado_em": *"([^"]+)".*/\1/p' "$f" | head -1)
            dia=${ger:0:10}
            echo "  $f -> ${dia:-nenhum}"
            [ "$dia" = "$hoje" ] || atrasados="${atrasados} ${f}(${dia:-nenhum})"
          done

          if grep -q '"_erro"' $arquivos 2>/dev/null; then
            erro=sim
          else
            erro=nao
          fi

          echo "hoje (BRT): $hoje · erro na ultima coleta: $erro"
          if [ -z "$atrasados" ] && [ "$erro" = "nao" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⏭  As tres unidades ja atualizaram hoje com sucesso — outro fire cobriu."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            if [ "$erro" = "sim" ]; then
              echo "▶️  A ultima coleta falhou — tentando de novo mesmo sendo de hoje."
            else
              echo "▶️  Faltam atualizar hoje:${atrasados}"
            fi
          fi

      - name: Refresh midias Meta (Escova + SPA)
        if: steps.recencia.outputs.skip != 'true'
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: python scripts/refresh_midias.py

      - name: Refresh Google Business Profile
        if: steps.recencia.outputs.skip != 'true'
        # Rota Supermetrics REST API (plano Connect + GMB add-on).
        # Google Business Profile API oficial nega candidatura pra single-
        # location owners, entao Supermetrics e a rota programatica viavel.
        # Pula silencioso se SUPERMETRICS_API_KEY nao estiver configurado.
        env:
          SUPERMETRICS_API_KEY: ${{ secrets.SUPERMETRICS_API_KEY }}
          SUPERMETRICS_TEAM_ID: ${{ secrets.SUPERMETRICS_TEAM_ID }}
        run: |
          if [ -z "$SUPERMETRICS_API_KEY" ]; then
            echo "SUPERMETRICS_API_KEY nao configurado — pulando refresh GBP."
            exit 0
          fi
          python scripts/refresh_google.py

      - name: Commit e push
        if: steps.recencia.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for f in data/midias_sociais.json data/spa/midias_sociais.json data/consolidado/midias_sociais.json; do
            git add "$f" 2>/dev/null || true
          done

          if git diff --cached --quiet; then
            echo "Sem mudancas nos arquivos de midias"
            exit 0
          fi

          # Resumo curto pro commit: quais arquivos mudaram + quaisquer
          # numeros-chave que dao pra extrair (gasto 7d + followers IG).
          resumo=""
          for f in data/midias_sociais.json data/spa/midias_sociais.json; do
            if git diff --cached --quiet -- "$f"; then
              continue
            fi
            u=$(basename "$(dirname "$f")")
            [ "$u" = "data" ] && u="escova"
            gasto=$(python -c "import json; d=json.load(open('$f')); print(d.get('meta_ads',{}).get('por_periodo',{}).get('7d',{}).get('gasto','?'))" 2>/dev/null || echo "?")
            seg=$(python -c "import json; d=json.load(open('$f')); print(d.get('instagram',{}).get('followers','?'))" 2>/dev/null || echo "?")
            resumo="${resumo} · ${u}: R\$${gasto} 7d / IG ${seg} seguidores"
          done

          data_brt=$(TZ=America/Sao_Paulo date +'%d/%m %H:%M')
          git commit -m "refresh midias: ${data_brt} BRT${resumo}"

          # PUSH COM REBASE E RETENTATIVA
          # Duas rotinas empurram para a main — o refresh do dashboard e o de
          # midia — e elas se cruzam. Em 16/09/2026 o refresh de midia puxou
          # dado bom das DUAS unidades, commitou, e o `git push` puro foi
          # recusado com "fetch first" porque o outro workflow tinha empurrado
          # nos sete minutos da execucao. O trabalho inteiro foi perdido e a
          # rotina apareceu como falha vermelha, escondendo que o token novo
          # tinha funcionado.
          for tentativa in 1 2 3; do
            if git push; then exit 0; fi
            echo "push recusado (tentativa ${tentativa}) — trazendo a main e tentando de novo"
            git pull --rebase --autostash origin main || true
            sleep $((tentativa * 5))
          done
          echo "::error::Nao consegui empurrar depois de 3 tentativas."
          exit 1

      # Detector de parada de entrega — Escova E SPA.
      #
      # Por que este passo existe: scripts/alerta_entrega.py foi escrito depois
      # do episodio de 27-31/08/2026, quando a conta parou de entregar por 4
      # dias com tudo ativo e ninguem viu (~R$ 480 queimados). O script ficou
      # pronto e NUNCA foi ligado a lugar nenhum — checado em 14/09/2026, zero
      # chamadas no repo inteiro. Um detector que nao roda e seguranca de
      # mentira.
      #
      # Por que DEPOIS do commit: alerta vermelho nunca pode impedir o dado de
      # ser salvo. Primeiro grava, depois avalia.
      #
      # Qual e o canal: sair != 0 faz o run falhar, e o GitHub manda e-mail de
      # falha pro dono do repo. E o canal de alerta que ja existe, sem montar
      # infraestrutura nova.
      #
      # Codigos do script: 1 = critico/alerta (falha de proposito) · 2 = nao
      # deu pra avaliar (serie curta demais — normal no SPA antes de 25/09,
      # entao so avisa, nao falha).
      - name: Alerta de parada de entrega (Escova + SPA)
        if: always()
        run: |
          falhou=0
          for f in data/midias_sociais.json data/spa/midias_sociais.json; do
            [ -f "$f" ] || continue
            u=$(basename "$(dirname "$f")"); [ "$u" = "data" ] && u="escova"
            echo "── $u"
            set +e
            python scripts/alerta_entrega.py "$f"
            rc=$?
            set -e
            [ "$rc" -eq 1 ] && falhou=1
            [ "$rc" -eq 2 ] && echo "   (sem serie suficiente pra avaliar — nao falha)"
          done
          if [ "$falhou" -eq 1 ]; then
            echo "::error::Entrega parada detectada. Veja o detalhe acima."
            exit 1
          fi
          echo "Entrega normal nas unidades avaliadas."

      # Auditoria de coerencia — os numeros batem entre si?
      #
      # Nenhum departamento acha este tipo de defeito sozinho: cada um olha o
      # proprio card e cada card, isolado, esta certo. O erro mora na costura
      # entre unidades, periodos e arquivos.
      #
      # Achado que motivou o passo (14/09/2026): a meta mensal do SPA estava em
      # R$ 60.000 dentro de um payload marcado _pre_abertura, com todo o resto
      # zerado - meta herdada da Escova que ninguem zerou. Invisivel enquanto o
      # SPA esta em zero-state; a partir de 25/09 passaria a contaminar o
      # consolidado em silencio.
      #
      # Roda depois do commit, como o alerta de entrega: conferencia nunca deve
      # impedir o dado de ser salvo.
      - name: Auditoria de coerencia (unidades · periodos · zero-state)
        if: always()
        run: |
          set +e
          python scripts/auditoria_coerencia.py
          rc=$?
          set -e
          if [ "$rc" -eq 1 ]; then
            echo "::error::Os numeros nao batem entre si. Veja o detalhe acima."
            exit 1
          fi
          exit 0
