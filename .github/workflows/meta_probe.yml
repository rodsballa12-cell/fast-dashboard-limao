name: Meta · sonda de leads (one-off)
# Sondas SÓ DE LEITURA contra a Graph API com o META_ACCESS_TOKEN.
#   alvo=leads    -> scripts/meta_probe_leads.py (a sonda original)
#   alvo=whatsapp -> scripts/meta_probe_whatsapp.py (17/11/2026: o que existe
#                    para ligar o WhatsApp oficial nas duas lojas)
# O repositório é público e este log também: os scripts não imprimem token
# nem nome de pessoa.
on:
  workflow_dispatch:
    inputs:
      alvo:
        description: "leads ou whatsapp"
        required: false
        default: leads
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests
      - env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          ALVO: ${{ inputs.alvo || 'leads' }}
        run: |
          if [ "$ALVO" = "whatsapp" ]; then python scripts/meta_probe_whatsapp.py
          else python scripts/meta_probe_leads.py; fi
