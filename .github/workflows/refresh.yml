name: Refresh Dashboard Data

on:
  workflow_dispatch:
  schedule:
    # 5×/dia · 00h, 12h, 15h, 18h, 21h BRT (= 03h, 15h, 18h, 21h, 00h UTC)
    # 00h BRT garante que o "hoje" já esteja fresco ao virar do dia
    - cron: '0 3,15,18,21,0 * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests

      - name: Refresh dashboard data (fetch API Trinks)
        env:
          TRINKS_API_KEY: ${{ secrets.TRINKS_API_KEY }}
          TRINKS_ESTABELECIMENTO_ID: ${{ secrets.TRINKS_ESTABELECIMENTO_ID }}
        run: python scripts/github_refresh.py

      - name: Commit e push se houve mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard_data.json
          if git diff --cached --quiet; then
            echo "Sem mudanças nos dados"
          else
            git commit -m "refresh: dashboard $(date -u +'%Y-%m-%d %H:%MZ')"
            git push
          fi
