name: Refresh Dashboard Data

on:
  workflow_dispatch:
  schedule:
    # 11×/dia · TODA HORA CHEIA (minuto :00) das 11h às 21h BRT
    #
    # GitHub Actions só aceita cron em UTC — mas como BRT = UTC-3 (offset de hora
    # inteira, sem DST desde 2019), o minuto :00 UTC bate exato com :00 BRT.
    # Só a HORA desloca. Mapping:
    #   14:00 UTC = 11:00 BRT
    #   15:00 UTC = 12:00 BRT
    #   ...
    #   21:00 UTC = 18:00 BRT
    #   23:00 UTC = 20:00 BRT
    #   00:00 UTC = 21:00 BRT (dia anterior)
    #
    # ⚠️  GitHub pode atrasar cron em horários de pico (documentado). Fire pode
    # sair 5-60min após o alvo. Botão manual "🔄 Atualizar dados" no dashboard
    # supre qualquer necessidade urgente.
    #
    # Consumo estimado: ~14 req/run × 11 runs = ~154 req/dia (~4.600/mês · 46% da cota)
    - cron: '0 14-23,0 * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests

      - name: Refresh dashboard data (fetch API Trinks)
        env:
          TRINKS_API_KEY: ${{ secrets.TRINKS_API_KEY }}
          TRINKS_ESTABELECIMENTO_ID: ${{ secrets.TRINKS_ESTABELECIMENTO_ID }}
        run: python scripts/github_refresh.py

      - name: Commit e push se houve mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard_data.json data/clientes_detalhes.json \
                  data/profissionais_cache.json data/clientes_lista_cache.json \
                  data/servicos_cache.json data/agend_detail_cache.json
          if git diff --cached --quiet; then
            echo "Sem mudanças nos dados"
          else
            git commit -m "refresh: dashboard $(date -u +'%Y-%m-%d %H:%MZ')"
            git push
          fi
