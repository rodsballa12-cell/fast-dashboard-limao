name: Refresh Dashboard Data

# Atualiza data/dashboard_data.json puxando dados frescos do Trinks.
#
# ESTRATÉGIA DE RESILIÊNCIA:
# GitHub Actions pula fires de cron silenciosamente em horários de pico.
# Solução: 3 fires por hora (:07, :27, :47) com early-exit — se qualquer
# um dos 3 firar, cobre a janela. Se o primeiro rodou, os outros 2
# detectam via `git log` (idade < 30 min) e encerram em <10s sem tocar API.
#
# HORÁRIO: 11h-21h BRT (14h-23h UTC + 0h UTC). BRT é UTC-3 fixo (sem DST
# desde 2019), então o minuto UTC = minuto BRT; só a hora desloca.
#
# CONSUMO API: ~20 req por execução real. 11 execuções reais/dia = ~220
# req/dia = ~6.600/mês (66% da cota de 10k). Fires de early-exit não
# consomem nada.

on:
  workflow_dispatch:
  schedule:
    - cron: '7 14-23,0 * * *'
    - cron: '27 14-23,0 * * *'
    - cron: '47 14-23,0 * * *'

permissions:
  contents: write

concurrency:
  group: refresh-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Early-exit se dashboard_data.json foi atualizado nas últimas 30 min.
      # Aplica só a fires scheduled — dispatch manual sempre roda.
      - name: Check recency
        id: recency
        if: github.event_name == 'schedule'
        run: |
          last_ts=$(git log -1 --format=%ct -- data/dashboard_data.json 2>/dev/null || echo 0)
          now=$(date -u +%s)
          age=$((now - last_ts))
          age_min=$((age / 60))
          echo "Última atualização: ${age_min} min atrás"
          if [ "$age" -lt 1800 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⏭  Refresh recente (<30min) — outro cron já cobriu esta janela."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "▶️  Rodando refresh (idade ${age_min} min)."
          fi

      - uses: actions/setup-python@v5
        if: steps.recency.outputs.skip != 'true'
        with:
          python-version: '3.12'

      - name: Install deps
        if: steps.recency.outputs.skip != 'true'
        run: pip install requests

      - name: Fetch Trinks + build dashboard
        if: steps.recency.outputs.skip != 'true'
        env:
          TRINKS_API_KEY: ${{ secrets.TRINKS_API_KEY }}
          TRINKS_ESTABELECIMENTO_ID: ${{ secrets.TRINKS_ESTABELECIMENTO_ID }}
        run: python scripts/github_refresh.py

      - name: Commit e push
        if: steps.recency.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard_data.json \
                  data/clientes_detalhes.json \
                  data/profissionais_cache.json \
                  data/clientes_lista_cache.json \
                  data/servicos_cache.json \
                  data/agend_detail_cache.json \
                  data/quota_status.json 2>/dev/null || true
          # Se quota_status foi limpo (arquivo removido), stage a remoção
          git add -u data/quota_status.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sem mudanças nos dados"
          else
            git commit -m "refresh: dashboard $(TZ=America/Sao_Paulo date +'%d/%m %H:%M') BRT"
            git push
          fi
