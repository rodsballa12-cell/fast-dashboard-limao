name: Refresh Dashboard Data

# Atualiza data/dashboard_data.json puxando dados frescos do Trinks.
#
# ESTRATÉGIA DE RESILIÊNCIA:
# GitHub Actions pula fires de cron silenciosamente em horários de pico.
# Solução: 3 fires por hora (:07, :27, :47) com early-exit — se qualquer
# um dos 3 firar, cobre a janela; os outros encerram em <10s sem tocar API.
#
# HORÁRIO: 11h-21h BRT (14h-23h UTC + 0h UTC). BRT é UTC-3 fixo (sem DST
# desde 2019), então o minuto UTC = minuto BRT; só a hora desloca.
#
# CONSUMO API — medido, não estimado (01/09/2026):
# O comentário anterior dizia "~20 req/execução · 11 execuções/dia · 220
# req/dia · 6.600/mês (66% da cota)". Os três números estavam errados.
# Medindo pelo próprio contador do Trinks (cota_api.totalUtilizado, gravado
# em dashboard_data.json a cada run), as execuções em regime custaram 24, 27,
# 27 e 30 req — chame de ~27. E a janela de recência era de 30 min, o que
# permite 2 execuções/hora, não 1: 11h × 2 = até 22 execuções/dia.
#   22 × 27 = ~594 req/dia = ~17.800/mês, contra uma cota de 10.000.
# Ou seja, o desenho estava 1,8× acima da cota mesmo em regime. Em 01/09 o
# painel queimou 1.007 req (10% da cota mensal) em um único dia.
#
# O custo por execução é alto porque agendamentos e transações são
# re-paginados do ANO INTEIRO a cada run (são a fonte primária de todas as
# abas). Reduzir isso exige mexer na análise; aqui atacamos a frequência,
# que é o fator de maior alavancagem e o de menor risco.
#
# DESENHO ATUAL: janela de recência de 75 min → ~8 execuções/dia
#   8 × 27 = ~216 req/dia = ~6.500/mês (65% da cota), com folga para os
#   picos de cache frio. Além disso, um teto de ritmo (abaixo) corta a
#   torneira se o consumo real furar o orçamento do mês.

on:
  workflow_dispatch:
  schedule:
    # 5 slots/dia cobrindo horário comercial · 2 fires defasados por slot
    # (redundância pro GH pular às vezes) · early-exit resolve a duplicação.
    # Slots em BRT: 11h · 14h · 17h · 20h · 22h
    # Meta: ~5 execuções REAIS/dia (vs ~8 antes) → economia ~40%
    - cron: '7 14,17,20,23,1 * * *'
    - cron: '37 14,17,20,23,1 * * *'

permissions:
  contents: write

concurrency:
  group: refresh-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Early-exit se dashboard_data.json foi atualizado nas últimas 75 min.
      # Aplica só a fires scheduled — dispatch manual sempre roda.
      #
      # Também faz backoff quando a cota mensal do Trinks está esgotada: sem
      # isso o check de recência abaixo nunca satisfaz (dashboard_data.json
      # deixa de ser commitado), e os 33 fires/dia rodam o script inteiro só
      # pra tomar 429 e gerar um commit de ruído. Com a cota marcada, tenta
      # de novo a cada 6h — o bastante pra sair rápido de um 429 transitório
      # mal classificado, sem martelar uma API que já disse não.
      - name: Check recency
        id: recency
        if: github.event_name == 'schedule'
        run: |
          if [ -f data/quota_status.json ] \
             && grep -q '"cota_esgotada": *true' data/quota_status.json; then
            det=$(sed -nE 's/.*"detectado_em": *"([^"]+)".*/\1/p' data/quota_status.json)
            det_ts=$(date -d "$det" +%s 2>/dev/null || echo 0)
            det_mes=$(date -d "$det" +%Y-%m 2>/dev/null || echo "")
            mes_atual=$(TZ=America/Sao_Paulo date +%Y-%m)
            idade=$(( $(date -u +%s) - det_ts ))
            if [ "$det_mes" = "$mes_atual" ] && [ "$det_ts" -gt 0 ] && [ "$idade" -lt 21600 ]; then
              echo "skip=true" >> $GITHUB_OUTPUT
              echo "⏭  Cota Trinks esgotada (detectada há $((idade/60)) min). Nova tentativa em ~6h."
              exit 0
            fi
            echo "🔄 Cota marcada como esgotada, mas é mês novo ou passaram 6h — tentando de novo."
          fi
          # TETO DE RITMO: corta a torneira quando o consumo real fura o
          # orçamento do mês. O contador vem do próprio Trinks (/v1/consumo),
          # gravado em cota_api pela run anterior. Orçamento = a fatia linear
          # do mês + 15% de tolerância + um piso de 250 req para o pico de
          # cache frio do dia 1, limitado a 92% da cota para sempre sobrar
          # reserva. Em 01/09 o consumo real (1.007) teria batido no teto
          # (~700) e bloqueado o resto do dia.
          tot=$(sed -nE 's/.*"totalUtilizado": *([0-9]+).*/\1/p' data/dashboard_data.json | head -1)
          cota=$(sed -nE 's/.*"cotaTotal": *([0-9]+).*/\1/p' data/dashboard_data.json | head -1)
          if [ -n "$tot" ] && [ -n "$cota" ] && [ "$cota" -gt 0 ]; then
            dia=$(TZ=America/Sao_Paulo date +%-d)
            dias=$(TZ=America/Sao_Paulo date -d "$(TZ=America/Sao_Paulo date +%Y-%m-01) +1 month -1 day" +%-d)
            teto=$(awk -v c="$cota" -v d="$dia" -v n="$dias" \
              'BEGIN{t=c*(d/n)*1.15+250; m=c*0.92; if(t>m)t=m; printf "%d", t}')
            echo "Cota Trinks: ${tot}/${cota} · teto para o dia ${dia}/${dias}: ${teto}"
            if [ "$tot" -gt "$teto" ]; then
              echo "skip=true" >> $GITHUB_OUTPUT
              echo "🛑 Consumo ${tot} acima do teto ${teto} — pulando para não estourar a cota do mês."
              exit 0
            fi
          else
            echo "⚠️  Não consegui ler cota_api de dashboard_data.json — seguindo sem teto de ritmo."
          fi

          # RECÊNCIA: usa o gerado_em do próprio JSON, não `git log`. Com
          # checkout raso (fetch-depth 2) o git não enxerga o pai do commit
          # mais antigo, então trata esse commit-fronteira como se tivesse
          # criado todos os arquivos: `git log -1 -- dashboard_data.json`
          # devolve a data DELE, não a da última alteração real do arquivo.
          # Medido em 01/09: o método antigo calculou 25 min de idade quando
          # o dado tinha 58. Erra para menos quando há commits de mídias ou de
          # código no meio (pula demais) e não tem como errar para mais de
          # forma controlada. O gerado_em mede exatamente o que interessa:
          # a idade do dado, independente do histórico git disponível.
          ger=$(sed -nE 's/.*"gerado_em": *"([^"]+)".*/\1/p' data/dashboard_data.json | head -1)
          last_ts=$(date -d "$ger" +%s 2>/dev/null || echo 0)
          now=$(date -u +%s)
          age=$((now - last_ts))
          age_min=$((age / 60))
          echo "Última atualização: ${age_min} min atrás (gerado_em ${ger:-desconhecido})"
          if [ "$last_ts" -gt 0 ] && [ "$age" -lt 4500 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⏭  Refresh recente (<75min) — outro cron já cobriu esta janela."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "▶️  Rodando refresh (idade ${age_min} min)."
          fi

      - uses: actions/setup-python@v5
        if: steps.recency.outputs.skip != 'true'
        with:
          python-version: '3.12'

      - name: Install deps
        if: steps.recency.outputs.skip != 'true'
        run: pip install requests

      - name: Fetch Trinks + build dashboard
        if: steps.recency.outputs.skip != 'true'
        env:
          TRINKS_API_KEY: ${{ secrets.TRINKS_API_KEY }}
          TRINKS_ESTABELECIMENTO_ID: ${{ secrets.TRINKS_ESTABELECIMENTO_ID }}
        run: python scripts/github_refresh.py

      - name: Commit e push
        if: steps.recency.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # BUG anterior: um único `git add A B C D quota_status.json 2>/dev/null || true`
          # fazia o comando INTEIRO falhar quando quota_status.json não existia,
          # engolia o erro (|| true), e nada era staged — commit ficava vazio
          # apesar do dashboard ter dados novos.
          # Fix: adicionar cada arquivo individualmente (o `|| true` só cobre o
          # próprio git add, não os outros).
          for f in data/dashboard_data.json \
                   data/clientes_detalhes.json \
                   data/profissionais_cache.json \
                   data/clientes_lista_cache.json \
                   data/servicos_cache.json \
                   data/agend_detail_cache.json \
                   data/agendamentos_ano_cache.json \
                   data/quota_status.json; do
            git add "$f" 2>/dev/null || true
          done
          # Se quota_status foi limpo (arquivo removido), stage a remoção
          git add -u data/quota_status.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sem mudanças nos dados"
          elif git diff --cached --quiet -- data/dashboard_data.json; then
            # Nada mudou no dashboard: o script saiu pela porta da cota esgotada
            # e só reescreveu quota_status.json. Rotular isso de "refresh" faz o
            # git log parecer saudável enquanto o painel está congelado.
            congelado=$(sed -nE 's/.*"gerado_em": *"([^"]+)".*/\1/p' data/dashboard_data.json | head -1)
            git commit -m "chore: cota Trinks esgotada · dashboard congelado em ${congelado:-desconhecido}"
            git push
          else
            git commit -m "refresh: dashboard $(TZ=America/Sao_Paulo date +'%d/%m %H:%M') BRT"
            git push
          fi
