name: Refresh Dashboard Data

on:
  workflow_dispatch:
  schedule:
    # 11×/dia · toda hora cheia de 11h às 21h BRT
    # = 14h,15h,16h,17h,18h,19h,20h,21h,22h,23h,00h UTC (00h UTC = 21h BRT do dia anterior)
    # Consumo estimado: ~14 req/run × 11 = ~154 req/dia (~4.600/mês · 46% da cota)
    - cron: '0 14-23,0 * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests

      - name: Refresh dashboard data (fetch API Trinks)
        env:
          TRINKS_API_KEY: ${{ secrets.TRINKS_API_KEY }}
          TRINKS_ESTABELECIMENTO_ID: ${{ secrets.TRINKS_ESTABELECIMENTO_ID }}
        run: python scripts/github_refresh.py

      - name: Commit e push se houve mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard_data.json data/clientes_detalhes.json \
                  data/profissionais_cache.json data/clientes_lista_cache.json
          if git diff --cached --quiet; then
            echo "Sem mudanças nos dados"
          else
            git commit -m "refresh: dashboard $(date -u +'%Y-%m-%d %H:%MZ')"
            git push
          fi
