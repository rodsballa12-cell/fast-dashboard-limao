name: Conselho Sync (auto)

# Dispara sempre que um briefing de Conselho eh commitado em Briefings/.
# Le o markdown, extrai as 3 decisoes e aplica no dashboard (Escova + SPA
# + Consolidado) marcando cada decisao como "pendente" (o Rodrigo aprova via /sincronizar). Grava ata +
# decisoes individuais em docs/. Se o Rodrigo mudar de ideia, rodar
# /sincronizar manualmente sobrescreve os status.

on:
  push:
    branches:
      - main
    paths:
      - 'Briefings/**-conselho.md'
      - 'docs/atas/*-conselho.md'
  workflow_dispatch:
    inputs:
      briefing:
        description: 'Path do briefing relativo ao repo (vazio = pega o mais recente)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: conselho-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Abrir cofre (dados criptografados)
        env:
          FAST_COFRE_CHAVE: ${{ secrets.FAST_COFRE_CHAVE }}
          FAST_PAINEL_SENHA: ${{ secrets.FAST_PAINEL_SENHA }}
        run: python3 -m pip install -q cryptography 2>/dev/null || python3 -m pip install -q --break-system-packages cryptography && python3 scripts/cofre.py abrir

      - name: Skip if this is our own sync commit
        id: guard
        shell: bash
        run: |
          msg="$(git log -1 --pretty=%s)"
          case "$msg" in
            "conselho "*"sincroniza dashboard (auto)")
              echo "Commit e do proprio sync. Pulando pra nao fazer loop."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "skip=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Setup Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rodar sync
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        env:
          BRIEFING_INPUT: ${{ github.event.inputs.briefing }}
        run: |
          if [ -n "$BRIEFING_INPUT" ]; then
            python scripts/sync_conselho.py "$BRIEFING_INPUT"
          else
            python scripts/sync_conselho.py --pendentes
          fi

      - name: Commit e push
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # caminho de verdade, nao "Briefings/" chutado: a ata pode ter vindo
          # de docs/atas, e commit que mente sobre a origem atrapalha quem audita
          origem="$(ls Briefings/*-conselho.md docs/atas/*-conselho.md 2>/dev/null | sort -t/ -k2 | tail -1)"
          latest="$(basename "${origem:-}")"
          if [ -z "$latest" ]; then
            echo "Sem briefing pra sincronizar."
            exit 0
          fi
          data="$(basename "$latest" | grep -oE '^[0-9]{4}-[0-9]{2}-[0-9]{2}')"

          # A ORDEM AQUI IMPORTA, e custou o dia 23/10/2026.
          #
          # `decisoes_abertas.py` carimba `gerado_em` com a hora atual, entao
          # data/decisoes.json muda em TODA rodada. Com ele adicionado antes
          # da conferencia, `git diff --cached --quiet` nunca mais ficou vazio:
          # a rodada que nao sincronizou nada mesmo assim commitava, com a
          # mensagem "sincroniza dashboard (auto)". Um arquivo que muda sozinho
          # desarmou o unico guarda que sabia dizer "nao havia o que fazer".
          #
          # Primeiro o que o sync DE FATO escreve; so depois o derivado.
          git add data/midias_sociais.json data/spa/midias_sociais.json data/consolidado/midias_sociais.json docs/atas docs/decisoes 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "Sem mudancas - briefing ja estava sincronizado (idempotente)."
            exit 0
          fi

          python scripts/decisoes_abertas.py || true
          git add data/decisoes.json 2>/dev/null || true

          {
            printf 'conselho %s: sincroniza dashboard (auto)\n\n' "$data"
            printf 'Aplicado pelo workflow conselho_sync.yml a partir de %s.\n' "$origem"
            printf 'Todas as decisoes entraram como status=pendente.\n'
            printf 'Rodar /sincronizar para aprovar, recusar ou reprogramar cada uma.\n'
          } > /tmp/commit-msg.txt

          git commit -F /tmp/commit-msg.txt
          git push
