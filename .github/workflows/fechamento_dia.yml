name: Fechamento do dia (conferencia)

# Abre um dia transacao a transacao e, se voce informar a diferenca do seu
# fechamento, procura o que explica exatamente aquele valor.
#
# Nao grava nada no repositorio: a resposta sai no log deste run.

on:
  workflow_dispatch:
    inputs:
      data:
        description: 'Dia a conferir (AAAA-MM-DD)'
        required: true
        type: string
      diferenca:
        description: 'Valor que esta sobrando ou faltando no seu caixa (ex: 174)'
        required: false
        type: string
      unidade:
        description: 'Qual unidade conferir'
        required: false
        default: 'escova'
        type: choice
        options:
          - escova
          - spa

permissions:
  contents: read

jobs:
  fechamento:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install requests python-dotenv
      - name: Conferir
        env:
          # Escova (legacy sem sufixo · TrinksClient(unidade='escova') tambem le sufixo _ESCOVA se presente)
          TRINKS_API_KEY: ${{ secrets.TRINKS_API_KEY }}
          TRINKS_ESTABELECIMENTO_ID: ${{ secrets.TRINKS_ESTABELECIMENTO_ID }}
          # SPA (multi-unit)
          TRINKS_API_KEY_SPA: ${{ secrets.TRINKS_API_KEY_SPA }}
          TRINKS_ESTABELECIMENTO_ID_SPA: ${{ secrets.TRINKS_ESTABELECIMENTO_ID_SPA }}
          DATA: ${{ inputs.data }}
          DIF: ${{ inputs.diferenca }}
          UNIDADE: ${{ inputs.unidade }}
        run: |
          args=(--data "$DATA" --unidade "${UNIDADE:-escova}")
          [ -n "$DIF" ] && args+=(--diferenca "$DIF")
          python scripts/fechamento_dia.py "${args[@]}"
