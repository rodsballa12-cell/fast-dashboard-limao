name: Trinks Discover Estabelecimentos (one-shot)

# Roda manualmente pra listar todos estabelecimentoIds que a API key
# consegue enxergar. Use pra descobrir o ID da SPA depois que Rodrigo
# ganhou acesso Trinks aos dois negocios.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Abrir cofre (dados criptografados)
        env:
          FAST_COFRE_CHAVE: ${{ secrets.FAST_COFRE_CHAVE }}
          FAST_PAINEL_SENHA: ${{ secrets.FAST_PAINEL_SENHA }}
        run: python3 -m pip install -q cryptography 2>/dev/null || python3 -m pip install -q --break-system-packages cryptography && python3 scripts/cofre.py abrir

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install requests
      - name: Discover estabelecimentos
        env:
          TRINKS_API_KEY: ${{ secrets.TRINKS_API_KEY }}
        run: python scripts/trinks_discover_units.py
